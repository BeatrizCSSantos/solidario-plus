<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova família | Solidário+</title>
  </head>
  <body>
    <header>
      <h1>Solidário+</h1>
      <nav>
        <a href="/">Início</a>
        <a href="{{ url_for('families.listar') }}">Famílias</a>
        <a href="{{ url_for('distributions.listar') }}">Distribuições</a>
      </nav>
    </header>

    <main>
      <h2>Cadastrar família atendida</h2>

      {% with mensagens = get_flashed_messages(with_categories=true) %} {% for
      categoria, mensagem in mensagens %}
      <p role="alert">{{ mensagem }}</p>
      {% endfor %} {% endwith %}

      <form method="post">
        <label for="codigo">Código da família</label>
        <input
          id="codigo"
          name="codigo"
          type="text"
          maxlength="20"
          value="{{ request.form.get('codigo', '') }}"
          placeholder="Ex.: FAM-001"
          required
        />

        <button type="submit">Cadastrar família</button>
      </form>
    </main>
  </body>
</html>
